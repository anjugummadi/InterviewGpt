<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>InterviewGPT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: ["groq", "pypdf"],
        entrypoint: "app.py",
        files: {
          "app.py": `
import streamlit as st
from groq import Groq

st.title("🤖 InterviewGPT")
api_key = st.text_input("Enter your Groq API Key:", type="password")

if api_key:
    client = Groq(api_key=api_key)
    st.success("API Key configured!")
    
    question = st.text_input("Interview Question", value="What are decorators in Python?")
    answer = st.text_area("Your Answer")
    
    if st.button("Evaluate"):
        if answer.strip():
            with st.spinner("Evaluating..."):
                response = client.chat.completions.create(
                    model="llama-3.3-70b-versatile",
                    messages=[
                        {"role": "system", "content": "You are a technical interviewer."},
                        {"role": "user", "content": f"Question: {question}\\nAnswer: {answer}"}
                    ]
                )
                st.write(response.choices[0].message.content)
`
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
